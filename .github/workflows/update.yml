name: 海外人気の自動更新

on:
  schedule:
    # 日本時間の 9時 / 21時。r/anime の週は金曜始まりなので、
    # 週が変わる金曜の朝には新しい週が載る。
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

concurrency:
  group: buzz-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 数字を集める
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 collect.py

      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json titles.json notes.json
          if git diff --staged --quiet; then
            echo "動きなし。コミットしません。"
          else
            git commit -m "海外人気の自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            pushed=0
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              echo "push が弾かれました。取り込み直して $i 回目の再挑戦…"
              git pull --rebase origin main || exit 1
              sleep 5
            done
            [ "$pushed" = 1 ] || { echo "3回試しても push できませんでした"; exit 1; }
          fi
